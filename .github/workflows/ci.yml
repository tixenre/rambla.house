      - name: Turno del Estudio vinculado a un pedido de alquiler normal contra Postgres real
        run: |
          cd backend
          # pedido_principal_id (#1308): el turno hereda SIEMPRE el cliente del
          # pedido principal (ignora lo que mande el request); solo se puede
          # vincular a un pedido tipo='diaria'; borrar el principal desvincula,
