name: CI

on:
  pull_request:
    branches: [main, dev]
    # Cambios solo-docs no disparan el CI (ahorro de minutos de Actions).
    # Si un PR toca código + docs, igual corre (paths-ignore solo saltea
    # cuando TODOS los archivos cambiados matchean estos globs).
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  push:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

# Cancela runs viejos del mismo branch al pushear de nuevo
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-content-images:
    name: Guardrail — cero fotos de contenido en el repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Bloquea imágenes de contenido (equipos/marcas/etc.) fuera del allowlist.
      # Fotos de contenido van a R2, no al repo. Allowlist en el propio script.
      - run: node scripts/check-no-content-images.mjs

  typecheck:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    # El frontend vive en frontend/ (simétrico a backend/) → los npm corren ahí.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Guardrail de ruteo: una ruta "parent" (con sub-rutas) DEBE proveer <Outlet/>,
      # si no las pantallas hijas no renderizan (bug silencioso — ver #752).
      - run: npm run check:routes

  lint:
    name: Lint + formato (eslint/prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # eslint corre prettier embebido (formato = error, reglas de React = aviso)
      - run: npm run lint

  unit-tests:
    name: Unit tests (node:test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # node:test corriendo TS nativo vía --experimental-strip-types (Node ≥22.6) — el resto
      # del frontend pinea Node 20 (setup-node de los otros jobs), este job va aparte a
      # propósito para no forzar el bump global solo por esto.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  python-syntax:
    name: Python lint + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile all Python files
        run: python -m compileall -q backend/
      - name: Ruff (lint — caza nombres indefinidos / imports al mover código)
        run: |
          # El gate que compileall no da: F821 (nombre indefinido) / F401 al
          # refactorizar. Config conservadora en backend/ruff.toml. Versión
          # pineada (= requirements-dev.txt) para que el gate sea reproducible.
          pip install ruff==0.15.18
          cd backend && ruff check .
      - name: pip-audit (CVEs en dependencias de producción — informativo)
        # NO bloquea el merge a propósito: un CVE nuevo en una dep transitiva sin
        # fix disponible no debe frenar todos los PRs. Surfacea el hallazgo en el
        # log; el equipo decide cuándo actuar (bump / ignore puntual).
        continue-on-error: true
        run: |
          pip install pip-audit
          cd backend && pip-audit -r requirements.txt

  python-tests:
    name: Python tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dev dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
      - name: Run pytest
        run: |
          cd backend
          # SECRET_KEY y ADMIN_EMAILS los setea conftest.py, pero por las
          # dudas los pasamos también acá para handlers que no los lean
          # vía conftest.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          # arca_fe/tests/ vive fuera de `tests/` (es un paquete portable con
          # su propia suite) — sin esto, nunca corría en CI.
          python -m pytest tests/ arca_fe/tests/ -v --tb=short

  db-migrations:
    name: Migraciones Alembic (Postgres real)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # El nombre lleva 'test' a propósito: el guard del test se niega a
          # correr (es destructivo) si la DATABASE_URL no parece de prueba.
          POSTGRES_DB: rambla_rental_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dev dependencies
        run: |
          cd backend
          pip install -r requirements-dev.txt
      - name: Run migraciones contra Postgres real
        run: |
          cd backend
          # Corre la cadena completa de migraciones contra una BD descartable y
          # exige llegar al head. Caza roturas estructurales antes de mergear.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export ALEMBIC_DB_TEST=1
          python -m pytest tests/test_alembic_upgrade_db.py -v --tb=short -m integration
      - name: Identidades de login + magic-link contra Postgres real (Fase 1 identidad)
        run: |
          cd backend
          # login_identities (lookup por sub, link/unlink scopeado, backfill de Google
          # por mail) + el backfill de la migración. Postgres real: el SQL toca UNIQUE
          # y FKs que el FakeConn no captura.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_login_identities_db.py -v --tb=short -m integration
      - name: Alta passwordless → cuenta liviana contra Postgres real (Fase 4 identidad)
        run: |
          cd backend
          # Alta con passkey sin cuenta previa: NOT NULL relajados de clientes,
          # UNIQUE(email) que tolera múltiples NULL, owner_email='' en la passkey, y
          # la cuenta inerte (cliente_verificado=False) hasta Didit. El FakeConn no
          # captura los constraints reales del esquema.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_clientes_livianas_db.py -v --tb=short -m integration
      - name: Tests de liquidación contra Postgres real (#88)
        run: |
          cd backend
          # Ejerce el SQL delicado del reporte de liquidación (fecha de saldado,
          # prorrateo, reparto) + la reconciliación, contra una BD descartable.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_reportes_liquidacion_db.py -v --tb=short -m integration
      - name: Tests de agrupación por categoría raíz (#814)
        run: |
          cd backend
          # Ejerce el SQL recursivo que trepa de la primera categoría del equipo
          # hasta su raíz (sector) para agrupar packing list + albarán.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_agrupar_categoria_db.py -v --tb=short -m integration
      - name: Concurrencia del gate de reservas contra Postgres real (núcleo sagrado)
        run: |
          cd backend
          # Núcleo SAGRADO: prueba la serialización REAL del FOR UPDATE + el conteo
          # batcheado (#626) contra Postgres — race por la última unidad y
          # overbooking en combos anidados (forward/backward/profundo). Los unit con
          # FakeConn no capturan la semántica real del lock; esto la fija en CI.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_reservas_concurrency_db.py tests/test_reservas_nested_db.py -v --tb=short -m integration
      - name: Puerta única de contenido contra Postgres real (services/contenido)
        run: |
          cd backend
          # Clava que la puerta de display (contenido_de) deriva de la MISMA tabla
          # kit_componentes que el gate (== componentes_de, restringido a equipos no
          # eliminados) y que el display es 1 nivel (no la expansión recursiva del
          # stock). Garantía estructural: lo mostrado no se desincroniza de lo reservado.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_contenido_puerta_db.py -v --tb=short -m integration
      - name: Calendario recursivo vía compuestos contra Postgres real (#934)
        run: |
          cd backend
          # Verifica que reservar un combo cuenta como consumo en todas las hojas
          # anidadas (combo → kit → hoja). Sin Postgres, el FOR UPDATE de psycopg2
          # y la semántica de reservado_total() no se puede ejercer.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_equipo_calendario_db.py -v --tb=short -m integration
      - name: dataio read-only + round-trip contra Postgres real (#922/#862)
        run: |
          cd backend
          # #922: export no muta slugs (read-only). #862 round-trip: export→import→export
          # es byte-idéntico (export/import son inversos; el slug sobrevive el viaje).
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_dataio_export_readonly_db.py tests/test_dataio_roundtrip_db.py -v --tb=short -m integration
      - name: ranking_service + guard admin contra Postgres real (#862)
        run: |
          cd backend
          # ranking_service: recalcular_ranking_todos asigna score 100 al equipo con
          # pedidos, 0 al equipo sin pedidos; dry_run no muta.
          # guard anti-#55: los 53 endpoints admin de _ADMIN_EXIST devuelven 4xx
          # (auth/validación) para un no-admin — nunca 2xx (guard ausente) ni 5xx
          # (DB antes del guard, indistinguible de 403 sin Postgres).
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_ranking_service_db.py tests/test_routes_admin_guard_db.py -v --tb=short -m integration
      - name: Canal C de specs (propuestas + embudo que aprende) contra Postgres real (#1176 F7)
        run: |
          cd backend
          # spec_propuestas_pendientes: proponer_desde_equipo/proponer_desde_unmatched
          # encolan candidatos de spec/alias nuevos desde unmatched frecuente; el
          # CHECK constraint de `tipo` y el JSONB del payload no los captura el
          # FakeConn de los tests unit.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_specs_ingesta_proponer_db.py -v --tb=short -m integration
      - name: Stream B de completitud de catálogo — enriquecer-from-html + fotos batch (#1051)
        run: |
          cd backend
          # enriquecer-from-html: mismo extractor que upload-html-source pero SIN
          # persistir en R2 — el candado real es que `equipos.html_source_url`
          # quede intacto, indistinguible con un FakeConn. fotos/from-urls: el
          # batch es best-effort (una URL que falla no aborta el resto).
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_stream_b_enriquecer_fotos_db.py -v --tb=short -m integration
      - name: Búsqueda de pedidos por nombre (case/acento-insensible, motor único) contra Postgres real
        run: |
          cd backend
          # Candado del bug: la búsqueda usaba LIKE crudo (case-SENSITIVE en
          # Postgres) → "tinc" no encontraba "Tincho". Sólo se prueba de verdad
          # contra una base real (necesita f_unaccent/pg_trgm del motor único).
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_pedidos_busqueda_db.py -v --tb=short -m integration
      - name: Dedup de inscripción a talleres + teléfono a E.164 contra Postgres real
        run: |
          cd backend
          # Candado: (1) no doble inscripción a la misma edición (2º email igual → 409);
          # (2) el teléfono se guarda en E.164 vía services.telefono. El flujo va por
          # TestClient (limiter real) + el dedup hace un SELECT bajo el FOR UPDATE de la
          # edición → sólo se prueba de verdad contra una base real.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_talleres_inscripcion_db.py -v --tb=short -m integration
      - name: Escuela v2 — clases ricas + borradores + T&C contra Postgres real (F2, #1278)
        run: |
          cd backend
          # Borradores (activo=False al crear), publicar re-verifica el estudio,
          # upsert de clases preserva la portada, tyc_aceptado_at.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_talleres_f2_db.py -v --tb=short -m integration
      - name: services/estudio — disponibilidad + reserva pública contra Postgres real
        run: |
          cd backend
          # Split del motor de disponibilidad/reservas del Estudio a services/estudio/
          # (CQRS-lite): primera cobertura de integración real de GET disponibilidad +
          # POST reservas del flujo PÚBLICO end-to-end — segunda reserva de la misma
          # franja rebota 409 sin fila huérfana (garantía dura: re-chequeo de
          # _centinela_libre bajo FOR UPDATE en _crear_pedido_estudio), y un taller
          # publicado bloquea tanto el GET como el POST visto desde el lado del Estudio.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_estudio_disponibilidad_publica_db.py -v --tb=short -m integration
      - name: services/estudio — ocupación pública (grilla semanal) contra Postgres real
        run: |
          cd backend
          # GET /api/estudio/ocupacion-publica: combina slot fijo + taller
          # publicado + reserva real del centinela para un rango, y NUNCA
          # expone cliente/nombre/número de pedido — la grilla semanal del
          # selector de fechas de /estudio consume esto para mostrar qué
          # franjas están ocupadas antes de que el cliente elija.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_estudio_ocupacion_publica_db.py -v --tb=short -m integration
      - name: services/estudio — alta/edición admin de reservas contra Postgres real (#1283 F6)
        run: |
          cd backend
          # Alta/edición manual desde el back-office reusa el mismo núcleo
          # (_crear_pedido_estudio) que el flujo público — incluida la concurrencia
          # (dos altas de la misma franja, solo una pasa). Existía antes del split a
          # services/estudio/ pero no estaba conectado al CI.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_estudio_admin_reservas_db.py -v --tb=short -m integration
      - name: services/estudio — promo combo (reemplaza al pack) contra Postgres real (#1283 F5)
        run: |
          cd backend
          # La promo es best-effort (nunca 409, arma promo_advertencia); los sueltos
          # siguen siendo stock duro. Existía antes del split a services/estudio/ pero
          # no estaba conectado al CI.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_promo_combo_estudio_db.py -v --tb=short -m integration
      - name: services/estudio — ítems veraces (plata real en alquiler_items) contra Postgres real (#1283 F2)
        run: |
          cd backend
          # Σ subtotal(ítems) == monto_total sin excepciones (liquidación/desglose/PDF
          # cierran por construcción); editar un slot fijo no se autobloquea contra sus
          # propios pedidos ya generados (exclude_slot_id en _centinela_libre). Existía
          # antes del split a services/estudio/ pero no estaba conectado al CI.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_estudio_items_veraces_db.py -v --tb=short -m integration
      - name: services/estudio — revalidación de disponibilidad al cambiar de estado contra Postgres real
        run: |
          cd backend
          # Confirmar/transicionar un pedido del Estudio usa revalidar_disponibilidad_estudio
          # (buffer PROPIO del espacio), no el _check_stock genérico (que aplicaría el buffer
          # GLOBAL de equipos y podía rechazar turnos adyacentes por error). Existía antes del
          # split a services/estudio/ pero no estaba conectado al CI.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_estudio_transiciones_stock_db.py -v --tb=short -m integration
      - name: services/estudio — el centinela ignora pedidos derivados (taller/estudio_fijo) contra Postgres real
        run: |
          cd backend
          # Bug real (pedido #445, dueño): un pedido de taller con rango mensual ancho
          # bloqueaba el espacio los días corridos del mes — su bloqueo real ya lo hace
          # _taller_bloqueante (clases_taller). _centinela_libre ahora excluye
          # tipo IN ('taller','estudio_fijo'); un turno real sigue bloqueando (regresión).
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_estudio_centinela_ignora_derivados_db.py -v --tb=short -m integration
      - name: Dashboard — no lista pedidos derivados (taller/estudio_fijo) ni el centinela contra Postgres real
        run: |
          cd backend
          # Bug real (pedido #445, dueño): salen_hoy/devuelven_hoy/devuelven_manana/
          # calendario mostraban el pedido mensual de un taller como si "saliera"/
          # "volviera" un día puntual; equipos_afuera listaba "Estudio (espacio)"
          # como si fuera un equipo físico prestado.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_dashboard_excluye_derivados_db.py -v --tb=short -m integration
      - name: Blindaje del pedido de taller (fechas/ítems/descuento/transición) contra Postgres real
        run: |
          cd backend
          # Fase 1 (#1308): el editor genérico no debe poder pisar fechas/plata
          # de un taller, PERO sí agregar matrícula (a diferencia del bloqueo en
          # bloque de estudio). 2 bugs latentes reales encontrados y cerrados acá:
          # _apply_pedido_items/_recalcular_total_pedido podían aplicarle un %
          # de descuento a un taller sin cliente/jornadas reales (0 por
          # coincidencia, no por regla); _revalidar_stock caía al motor
          # genérico, que contaba el centinela contra el mes ENTERO del taller
          # y podía rechazar una transición legítima por un turno real
          # cualquiera ese mes.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_taller_pedidos_blindaje_db.py -v --tb=short -m integration
      - name: Detalle del pedido de taller trae las clases reales de la edición contra Postgres real
        run: |
          cd backend
          # Fase 1 (#1308): GET /alquileres/{id} de un taller ahora suma
          # clases_taller (fecha + franja horaria reales, vía taller_edicion_id)
          # — la pieza de datos que le permite al front mostrar la verdad en
          # vez del rango contable ("7 jornadas", bug real #445).
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_pedido_taller_clases_enriquecido_db.py -v --tb=short -m integration
      - name: Escuela v2 — instructores como entidad contra Postgres real (F3, #1278)
        run: |
          cd backend
          # Mini-CRUD + N↔N con talleres + 409 al borrar vinculado.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export RESERVAS_DB_TEST=1
          python -m pytest tests/test_talleres_f3_db.py -v --tb=short -m integration
      - name: Backfill de datos legacy contra una base descartable (% histórico)
        run: |
          cd backend
          # Hace DROP/CREATE SCHEMA + init_db() + alembic upgrade head — corre sobre una
          # BD que el resto del job no vuelve a tocar después. test_backfill_descuento_
          # cliente_pct_migration_db.py (#1219) no tenía step propio hasta ahora.
          # test_instructores_backfill_migration_db.py (el otro test que corría acá) se
          # retiró en Escuela v2 F6: su premisa (simular una DB pre-F3 vía init_db() +
          # una fila legacy a mano) dejó de ser reproducible una vez que init_db() nace
          # directo en la forma final (sin instructor_nombre) — ver esc7l8i9m0p1.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export ALEMBIC_DB_TEST=1
          python -m pytest tests/test_backfill_descuento_cliente_pct_migration_db.py -v --tb=short -m integration
      - name: Backfill dueno='Estudio' + comisiones contra Postgres real (Fase 4, #1283)
        run: |
          cd backend
          # El centinela pasa de dueno='Rambla' a 'Estudio' (economía separada) y
          # comisiones_modelo custom del dueño suma la entrada Estudio sin pisar lo
          # que ya estaba. Escrito en la Fase 4 de #1283 pero nunca se le agregó
          # step propio — no corría en CI hasta ahora.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export ALEMBIC_DB_TEST=1
          python -m pytest tests/test_backfill_estudio_dueno_comisiones_migration_db.py -v --tb=short -m integration
      - name: Backfill ítems veraces del Estudio contra Postgres real (Fase 2, #1283)
        run: |
          cd backend
          # Pedidos viejos del Estudio con centinela en $0 pasan a ítems veraces
          # (Σ subtotales = monto_total): sin pack → centinela = monto_total; con
          # pack → split espacio/pack. Escrito en la Fase 2 de #1283 pero nunca se
          # le agregó step propio — no corría en CI hasta ahora.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export ALEMBIC_DB_TEST=1
          python -m pytest tests/test_backfill_items_estudio_migration_db.py -v --tb=short -m integration
      - name: Unificar equipos legacy del Estudio contra Postgres real (#1283)
        run: |
          cd backend
          # Re-atribuye el historial de los 2 equipos simples pre-centinela
          # (id 266/327, productos reales con pedidos ya facturados) al
          # centinela/combo actuales y los borra — incluye la guarda de
          # componente-vivo-de-otro-combo y el caso sin pack curado.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
          export ALEMBIC_DB_TEST=1
          python -m pytest tests/test_unificar_estudio_legacy_migration_db.py -v --tb=short -m integration
      - name: Escuela v2 — video hero + modalidades de pago contra Postgres real (F4a, #1278)
        run: |
          cd backend
          # Extracción de video_id + poster (mockeado, sin red real), upsert de
          # modalidades, validación, fallback sintético y snapshot al inscribirse.
          export SECRET_KEY=ci-test-secret-not-for-production
          export ADMIN_EMAILS=admin@test.com
          export DATABASE_URL=postgresql://postgres:postgres@localhost:5432/rambla_rental_test
