name: Mobile smoke tests

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

# Cancela runs viejos del mismo branch al re-pushear (igual que ci.yml).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-smoke:
    runs-on: ubuntu-latest
    # 20 (no 15): deja margen real al timeout+reintento de "Install Playwright
    # browsers" (hasta 3×180s si el mirror del runner se cuelga) sin comerse
    # el resto del job — ver .github/actions/install-playwright-browsers.
    timeout-minutes: 20
    # El frontend vive en frontend/ (simétrico a backend/) → los npm corren ahí.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Cachea los browsers de Playwright (~100 MB) para no redescargarlos en
      # cada corrida. Se invalida cuando cambia el lockfile (puede cambiar la
      # versión de Playwright). Las OS deps de --with-deps no se cachean (apt).
      # hashFiles resuelve relativo a la raíz del repo (no a working-directory).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install Playwright browsers
        uses: ./.github/actions/install-playwright-browsers

      - name: Run mobile smoke tests
        run: npx playwright test
        env:
          CI: true
